<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="45%" stop-color="#ffdb70" />
      <stop offset="100%" stop-color="#ceb15a" />
    </linearGradient>
  </defs>

  <!-- Full-size square with micro-rounded corners matching standard browser tab box (like ASORA) -->
  <rect 
    x="0" 
    y="0" 
    width="512" 
    height="512" 
    rx="40" 
    ry="40" 
    fill="url(#goldGradient)" 
  />

  <!-- Subtle inner border highlight -->
  <rect 
    x="2" 
    y="2" 
    width="508" 
    height="508" 
    rx="38" 
    ry="38" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="6" 
    stroke-opacity="0.25" 
  />

  <!-- Bold, perfectly proportioned "S" with comfortable breathing room inside the full box -->
  <text 
    x="256" 
    y="272" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="345" 
    fill="#121212" 
    letter-spacing="-0.03em"
  >S</text>
</svg>